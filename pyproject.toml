[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-sampling-planner"
version = "0.1.0"
description = "质检抽样规划 CLI - 批次数据导入、抽样规则配置、覆盖率报告、风险提示"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "pytest>=7.0.0",
    "click>=8.0.0",
    "PyYAML>=6.0",
    "tabulate>=0.9.0",
]

[project.scripts]
qsp = "qsp.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
